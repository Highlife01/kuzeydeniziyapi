    <!-- Canonical Domain Redirect (apex -> www on production domain, preserves *.web.app during setup) -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (!h || h === 'localhost' || h === '127.0.0.1' || h.indexOf('web.app') !== -1 || h.indexOf('firebaseapp.com') !== -1) {
          return;
        }
        var targetHost = 'www.kuzeydenizinsaat.com.tr';
        if (h === 'kuzeydenizinsaat.com.tr' || h === 'kuzeydeniziyapi.com.tr' || h === 'www.kuzeydeniziyapi.com.tr') {
          try {
            if (!sessionStorage.getItem('kd_canon_redirected')) {
              sessionStorage.setItem('kd_canon_redirected', '1');
              window.location.replace(
                'https://' +
                  targetHost +
                  window.location.pathname +
                  window.location.search +
                  window.location.hash
              );
            }
          } catch (e) {}
        }
      })();
    </script>
